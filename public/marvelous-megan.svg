<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <radialGradient id="hair" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="60%" stop-color="#F5C76A"/>
      <stop offset="100%" stop-color="#C99A3E"/>
    </radialGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="skin" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFE4D0"/>
      <stop offset="100%" stop-color="#F5C9A8"/>
    </radialGradient>
  </defs>

  <!-- Hair back layer -->
  <path d="M 50 80 Q 30 130 45 200 L 70 210 Q 60 150 70 100 Z" fill="url(#hair)"/>
  <path d="M 150 80 Q 170 130 155 200 L 130 210 Q 140 150 130 100 Z" fill="url(#hair)"/>

  <!-- Neck -->
  <rect x="90" y="130" width="20" height="20" fill="url(#skin)"/>

  <!-- Dress / shoulders -->
  <path d="M 60 160 Q 100 140 140 160 L 160 240 L 40 240 Z" fill="url(#dress)" stroke="#D4AF37" stroke-width="1.5"/>
  <!-- Gold neckline -->
  <path d="M 80 152 Q 100 162 120 152" fill="none" stroke="#D4AF37" stroke-width="2"/>

  <!-- Face -->
  <ellipse cx="100" cy="100" rx="38" ry="44" fill="url(#skin)"/>

  <!-- Hair front bangs -->
  <path d="M 62 75 Q 80 55 100 60 Q 120 55 138 75 Q 140 95 130 95 Q 120 80 100 80 Q 80 80 70 95 Q 60 95 62 75 Z" fill="url(#hair)"/>
  <!-- Side hair strands -->
  <path d="M 62 80 Q 55 110 62 140 Q 70 130 70 100 Z" fill="url(#hair)"/>
  <path d="M 138 80 Q 145 110 138 140 Q 130 130 130 100 Z" fill="url(#hair)"/>

  <!-- Eyebrows -->
  <path d="M 78 92 Q 85 88 92 92" fill="none" stroke="#8B6914" stroke-width="2" stroke-linecap="round"/>
  <path d="M 108 92 Q 115 88 122 92" fill="none" stroke="#8B6914" stroke-width="2" stroke-linecap="round"/>

  <!-- Eyes (big blue) -->
  <ellipse cx="85" cy="103" rx="6" ry="7" fill="white"/>
  <ellipse cx="115" cy="103" rx="6" ry="7" fill="white"/>
  <circle cx="85" cy="104" r="4.5" fill="#4A90D9"/>
  <circle cx="115" cy="104" r="4.5" fill="#4A90D9"/>
  <circle cx="85" cy="104" r="2.2" fill="#1a1a1a"/>
  <circle cx="115" cy="104" r="2.2" fill="#1a1a1a"/>
  <circle cx="86.5" cy="102" r="1" fill="white"/>
  <circle cx="116.5" cy="102" r="1" fill="white"/>

  <!-- Eyelashes -->
  <path d="M 79 100 L 77 98 M 91 100 L 93 98" stroke="#3a2a10" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 109 100 L 107 98 M 121 100 L 123 98" stroke="#3a2a10" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M 100 110 Q 98 118 100 122 Q 102 122 102 120" fill="none" stroke="#D4A88A" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M 88 128 Q 100 138 112 128" fill="none" stroke="#B5485B" stroke-width="2" stroke-linecap="round"/>
  <path d="M 90 128 Q 100 134 110 128 Q 100 130 90 128 Z" fill="#E07A8F"/>

  <!-- Cheeks blush -->
  <ellipse cx="76" cy="118" rx="5" ry="3" fill="#F5A8B8" opacity="0.5"/>
  <ellipse cx="124" cy="118" rx="5" ry="3" fill="#F5A8B8" opacity="0.5"/>

  <!-- Gold star earrings -->
  <polygon points="58,108 60,112 64,112 61,115 62,119 58,117 54,119 55,115 52,112 56,112" fill="#D4AF37"/>
  <polygon points="142,108 144,112 148,112 145,115 146,119 142,117 138,119 139,115 136,112 140,112" fill="#D4AF37"/>

  <!-- Crown / tiara -->
  <path d="M 70 65 L 80 50 L 90 62 L 100 45 L 110 62 L 120 50 L 130 65 Z" fill="#D4AF37" stroke="#8B6914" stroke-width="1"/>
  <circle cx="100" cy="52" r="2.5" fill="#FF6B9D"/>
  <circle cx="85" cy="58" r="1.8" fill="#4A90D9"/>
  <circle cx="115" cy="58" r="1.8" fill="#4A90D9"/>
</svg>
